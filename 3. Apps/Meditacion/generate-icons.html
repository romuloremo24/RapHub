<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(id, size) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  const r = size / 2;

  // Background
  const bg = ctx.createRadialGradient(r, r, 0, r, r, r);
  bg.addColorStop(0, '#1a0a3e');
  bg.addColorStop(1, '#0f172a');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.22);
  ctx.fill();

  // Orb
  const orb = ctx.createRadialGradient(r * 0.8, r * 0.75, 0, r, r, r * 0.5);
  orb.addColorStop(0, '#a78bfa');
  orb.addColorStop(0.5, '#7c3aed');
  orb.addColorStop(1, '#4c1d95');
  ctx.fillStyle = orb;
  ctx.beginPath();
  ctx.arc(r, r, r * 0.42, 0, Math.PI * 2);
  ctx.fill();

  // Ring
  ctx.strokeStyle = 'rgba(167,139,250,0.3)';
  ctx.lineWidth = size * 0.018;
  ctx.beginPath();
  ctx.arc(r, r, r * 0.55, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(167,139,250,0.15)';
  ctx.lineWidth = size * 0.01;
  ctx.beginPath();
  ctx.arc(r, r, r * 0.68, 0, Math.PI * 2);
  ctx.stroke();

  return c.toDataURL('image/png');
}

const d192 = drawIcon('c192', 192);
const d512 = drawIcon('c512', 512);

document.body.innerHTML += `
  <br><a href="${d192}" download="icon-192.png">Download icon-192.png</a>
  <br><a href="${d512}" download="icon-512.png">Download icon-512.png</a>
  <p style="font-family:sans-serif; color:#666; margin-top:12px">
    Abre esta página en el navegador, descarga los dos íconos<br>
    y colócalos en la misma carpeta que index.html.
  </p>
`;
</script>
</body>
</html>
